name: Release NuGet Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build src/Verity.SDK/Verity.SDK.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/Verity.SDK/Verity.SDK.csproj --configuration Release --no-build --output artifacts

      - name: Generate checksum
        run: |
          cd artifacts
          package="$(ls *.nupkg)"
          sha256sum "$package" > "$package.sha256"

      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Verity .NET SDK ${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.sha256 --clobber

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
